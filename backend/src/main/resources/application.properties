spring.application.name=leasing-document-backend

# Disable Spring Boot's default in-memory user/password because
# DOC SECURE uses its own database-backed login + JWT flow.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# =========================================================
# DATABASE
# =========================================================
#
# Sensitive values are read from environment variables.
#
# Required:
#   DOCSECURE_DB_PASSWORD
#   DOCSECURE_MYSQL_TRUSTSTORE_PASSWORD
#
# MySQL TLS:
#   - VERIFY_CA encrypts the connection.
#   - The MySQL server certificate is verified using
#     mysql-truststore.p12.
#   - MySQL server has require_secure_transport=ON.
#
# IMPORTANT:
#   TLS truststore properties are kept OUT of the JDBC URL so
#   the truststore password is not printed in Hibernate's
#   "Database JDBC URL" startup log.
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/leasing_document_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DOCSECURE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.data-source-properties.sslMode=VERIFY_CA
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:src/main/resources/mysql-truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DOCSECURE_MYSQL_TRUSTSTORE_PASSWORD}
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================================================
# HTTPS / TLS SERVER
# =========================================================
#
# Required:
#   DOCSECURE_SERVER_KEYSTORE_PASSWORD
# =========================================================

server.port=8443

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${DOCSECURE_SERVER_KEYSTORE_PASSWORD}
server.ssl.key-alias=leasing-backend


# =========================================================
# MULTIPART FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================
# JWT SECURITY
# =========================================================
#
# Required:
#   DOCSECURE_JWT_SECRET
# =========================================================

app.jwt.secret=${DOCSECURE_JWT_SECRET}
app.jwt.expiration-ms=28800000


# =========================================================
# SECURE DOCUMENT STORAGE
# =========================================================

app.secure-storage.root=secure-storage
app.secure-storage.key-file=secure-storage/aes.key
