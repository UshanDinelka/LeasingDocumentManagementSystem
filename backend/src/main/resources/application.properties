spring.application.name=leasing-document-backend

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/leasing_document_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# MULTIPART FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================
# JWT SECURITY
# =========================================================

app.jwt.secret=leasing-document-backend-secret-key-2026
app.jwt.expiration-ms=28800000


# =========================================================
# STEP 7 - SECURE DOCUMENT STORAGE
# =========================================================

app.secure-storage.root=secure-storage
app.secure-storage.key-file=secure-storage/aes.key